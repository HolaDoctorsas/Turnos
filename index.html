<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>holadr — Gestión de Turnos 24/7</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚕️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#28289D;--navy-lt:#3D3DF7;--mint:#4EE0B6;--cyan:#2DD3FF;--bg:#F4F6FB;--card:#fff;--txt:#1A1D2E;--mut:#6B7194;--danger:#E74C6F;--warn:#F5A623;--ok:#4EE0B6;--bdr:#E2E6F0;--gray:#ECECEC}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
button{font-family:inherit;cursor:pointer;transition:.15s}
button:active{transform:scale(.97)}
select,input,textarea{font-family:inherit;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--navy)!important}
::-webkit-scrollbar{height:5px;width:5px}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px}
.hdr{background:linear-gradient(135deg,var(--navy),var(--navy-lt) 60%,var(--cyan));padding:16px 16px 10px;color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 16px rgba(40,40,157,.3)}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:-.5px}
.hdr .sub{font-size:10px;opacity:.7;margin-top:2px}
.abtn{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:7px;padding:5px 10px;font-size:10px;font-weight:600}
.abtn.on{background:var(--mint);color:var(--navy)}
.tabs{display:flex;gap:3px;margin-top:10px}
.tab{flex:1;padding:7px 2px;border:none;border-radius:7px;background:0;color:#fff;font-size:11px;font-weight:400;border-bottom:2px solid transparent;transition:.2s}
.tab.a{background:rgba(255,255,255,.2);font-weight:600;border-bottom-color:var(--mint)}
.tab:hover:not(.a){background:rgba(255,255,255,.1)}
.cnt{padding:14px 14px 90px;max-width:920px;margin:0 auto}
.cd{background:var(--card);border-radius:13px;padding:14px;box-shadow:0 1px 8px rgba(0,0,0,.05);margin-bottom:10px}
.wnav{display:flex;justify-content:space-between;align-items:center}
.wnav button{background:0;border:1px solid var(--bdr);border-radius:7px;padding:5px 12px;font-size:15px;color:var(--txt)}
.gw{overflow-x:auto;margin:0 -2px;padding:0 2px}
table.g{width:100%;border-collapse:separate;border-spacing:2px;min-width:640px}
.g th{padding:5px 3px;font-size:9px;font-weight:600;text-align:center;color:var(--mut)}
.g th.td{color:var(--navy);background:rgba(45,211,255,.1);border-radius:6px}
.g th.su{color:var(--danger)}
.g .ec{padding:4px 6px;font-size:10px;font-weight:600;background:var(--card);border-radius:6px 0 0 6px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.g .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--cyan));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;margin-right:4px;vertical-align:middle;flex-shrink:0}
.g .sc{padding:3px 1px;text-align:center;border-radius:5px;cursor:pointer;transition:.15s;min-width:54px}
.g .sc:hover{transform:scale(1.04);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.g .sc.tb{outline:2px solid var(--navy);outline-offset:-1px}
.g .sc .si{font-size:13px}
.g .sc .sl{font-size:7px;font-weight:700}
.g .sc .sh{font-size:7px;font-weight:600;opacity:.75;margin-top:1px}
.g .hc{padding:4px 5px;text-align:center;font-size:11px;font-weight:700;background:var(--card);border-radius:0 6px 6px 0}
.leg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;justify-content:center}
.leg span{padding:2px 8px;border-radius:14px;font-size:9px;font-weight:600;white-space:nowrap}
.cov{display:flex;gap:5px;flex-wrap:wrap}
.cov>div{flex:1;min-width:58px;border-radius:8px;padding:6px 3px;text-align:center}
.bp{display:block;width:100%;padding:13px;background:linear-gradient(135deg,var(--navy),var(--cyan));color:#fff;border:none;border-radius:13px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(40,40,157,.3);margin-top:8px}
.bp:hover{box-shadow:0 6px 20px rgba(40,40,157,.4);transform:translateY(-1px)}
.rqc{border-left:4px solid var(--cyan)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;opacity:0;animation:fi .2s forwards}
@keyframes fi{to{opacity:1}}
.mdl{background:var(--card);border-radius:18px 18px 0 0;padding:22px 18px 28px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;transform:translateY(100%);animation:su .3s .1s forwards}
@keyframes su{to{transform:translateY(0)}}
.mdl h3{font-size:15px;font-weight:700}
.mdl label{font-size:10px;font-weight:600;color:var(--mut);display:block;margin:10px 0 4px}
.mdl select,.mdl input,.mdl textarea{width:100%;padding:9px 11px;border:1px solid var(--bdr);border-radius:9px;font-size:13px;background:#fff}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tb{padding:9px 6px;border:2px solid var(--bdr);border-radius:9px;background:0;font-size:11px;font-weight:500;text-align:left}
.tb.on{border-color:var(--cyan);background:rgba(45,211,255,.08)}
.ntf{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-30px);padding:9px 22px;border-radius:11px;font-size:12px;font-weight:600;color:#fff;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:ni .3s forwards,no .3s 2.5s forwards}
@keyframes ni{to{transform:translateX(-50%) translateY(0)}}
@keyframes no{to{transform:translateX(-50%) translateY(-30px);opacity:0}}
.hid{display:none}
.sg{display:grid;gap:8px}
.si4{grid-template-columns:1fr 1fr 1fr 1fr}
.si3{grid-template-columns:1fr 1fr 1fr}
.sbox{border-radius:9px;padding:10px;text-align:center}
.snum{font-size:20px;font-weight:700}
.slbl{font-size:8px;color:var(--mut)}
.tc{display:flex;align-items:center;gap:10px}
.tav{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--cyan));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.tbdg{padding:2px 7px;border-radius:12px;font-size:8px;font-weight:700;display:inline-block;margin-bottom:2px}
.mt-tag{background:rgba(245,166,35,.12);color:#B8860B;padding:1px 6px;border-radius:8px;font-size:8px;font-weight:600;margin-left:4px}
@media(max-width:640px){.hdr{padding:12px 12px 8px}.hdr h1{font-size:15px}.cnt{padding:10px 8px 70px}.tab{font-size:9px;padding:5px 2px}}
</style>
</head>
<body>
<div class="hdr">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;align-items:center;gap:8px">
      <svg width="36" height="32" viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <path d="M100 16C50 16 16 50 16 88C16 112 30 132 52 144L34 172L72 154C82 158 90 160 100 160C150 160 184 126 184 88C184 50 150 16 100 16Z" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="72" cy="72" r="8" fill="#4EE0B6"/><circle cx="128" cy="72" r="8" fill="#4EE0B6"/>
        <path d="M68 108C68 108 80 128 100 128C120 128 132 108 132 108" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none"/>
      </svg>
      <div>
        <div style="display:flex;align-items:baseline;line-height:1"><span style="font-size:22px;font-weight:800;color:#fff">hola</span><span style="font-size:22px;font-weight:800;color:#4EE0B6">dr</span><span style="font-size:22px;color:#4EE0B6;font-weight:800">.</span></div>
        <div class="sub">Turnos 24/7 · 3×8h · 4 TC + 1 MT · N→Descanso obligatorio</div>
      </div>
    </div>
    <button class="abtn" id="aBtn" onclick="togAdmin()">👤 Vista</button>
  </div>
  <div class="tabs">
    <button class="tab a" onclick="sw('cal',this)">📅 Calendario</button>
    <button class="tab" onclick="sw('sol',this)">📝 Solicitudes</button>
    <button class="tab" onclick="sw('eq',this)">👥 Equipo</button>
    <button class="tab" onclick="sw('leg',this)">⚖️ Legal</button>
  </div>
</div>
<div class="cnt">
  <div id="v-cal"></div><div id="v-sol" class="hid"></div><div id="v-eq" class="hid"></div><div id="v-leg" class="hid"></div>
</div>
<div id="ovl" class="ov hid" onclick="if(event.target===this)cMdl()"><div class="mdl" id="mdlC"></div></div>
<div id="ntEl" class="ntf hid"></div>

<script>
// ====== TURNOS 24/7 — 4.5 PERSONAS ======
// M 06:00–14:00 (8h) | T 14:00–22:00 (8h) | N 22:00–06:00 (8h) = 24h continuo
// TC: 44h/sem (hasta 14 jul), 42h/sem (desde 15 jul) = 5 turnos de 8h + comp
// MT: 22h/sem = 3 turnos de 8h (24h)
// N→D obligatorio. T→M prohibido.

const SH={
  M:{l:"Mañana",t:"06:00–14:00",bg:"#A1EBFF",tc:"#28289D",ic:"☀️",h:8},
  T:{l:"Tarde",t:"14:00–22:00",bg:"#4EE0B6",tc:"#28289D",ic:"🌤",h:8},
  N:{l:"Noche",t:"22:00–06:00",bg:"#3D3DF7",tc:"#fff",ic:"🌙",h:8},
  C:{l:"Capacitación",t:"07:30–16:30",bg:"#9E9ED3",tc:"#28289D",ic:"📚",h:9},
  X:{l:"Especial",t:"Variable",bg:"#E8E8FD",tc:"#28289D",ic:"⚙️",h:0}, // turno con horario personalizado
  D:{l:"Descanso",t:"—",bg:"#ECECEC",tc:"#6B7194",ic:"🏖",h:0},
  SC:{l:"Sin contrato",t:"—",bg:"#F4F6FB",tc:"#C0C4D6",ic:"—",h:0}
};
const CW=new Date(2026,4,4),CD=new Date(2026,4,7),JC=new Date(2026,6,15);

// Fechas especiales fijas (aplican a TODOS los empleados)
const SP_DEFAULT={
  '2026-05-07':{code:'C',t:'07:30–16:30',h:8,note:'Capacitación (1h almuerzo)'},
  '2026-05-08':{code:'X',t:'07:00–14:00',h:6.5,note:'Inducción (30min almuerzo)'},
  '2026-05-09':{code:'D',t:'—',h:0,note:'Descanso'},
  '2026-05-10':{code:'D',t:'—',h:0,note:'Descanso'},
  '2026-05-11':{code:'X',t:'09:00–16:30',h:6.5,note:'Adaptación (1h almuerzo)'},
  '2026-05-12':{code:'X',t:'09:00–17:00',h:7,note:'Adaptación (1h almuerzo)'},
  '2026-05-13':{code:'X',t:'08:00–17:00',h:8,note:'Jornada completa (1h almuerzo)'},
  '2026-05-14':{code:'X',t:'08:00–17:00',h:8,note:'Jornada completa (1h almuerzo)'},
};

// Overrides personalizados: guardados en localStorage
// Formato: { 'YYYY-MM-DD': { code, t (horario), h (horas netas), note }, ... }
// Pueden ser por fecha (todos) o por fecha+empleado ('YYYY-MM-DD_E1')
let customOvr = JSON.parse(localStorage.getItem('hd-ovr')) || {};
function svOvr(){localStorage.setItem('hd-ovr',JSON.stringify(customOvr))}

// Obtener override para una fecha y opcionalmente un empleado
function getOverride(dateStr, empId) {
  // Primero buscar override específico por empleado+fecha
  const empKey = dateStr + '_' + empId;
  if (customOvr[empKey]) return customOvr[empKey];
  // Luego override global por fecha
  if (customOvr[dateStr]) return customOvr[dateStr];
  // Luego fechas especiales por defecto
  if (SP_DEFAULT[dateStr]) return SP_DEFAULT[dateStr];
  return null;
}

function setOverride(dateStr, empId, data) {
  // Si empId es null, aplica a todos; si tiene valor, es por empleado
  const key = empId ? dateStr + '_' + empId : dateStr;
  if (data === null) {
    delete customOvr[key];
  } else {
    customOvr[key] = data;
  }
  svOvr();
}
const VN={M:['M','T','N','D'],T:['T','N','D'],N:['D'],D:['M','T','N','D']};
const DY=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const MO=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const RQT={cambio:{l:"Cambio de Turno",ic:"🔄",c:"#2DD3FF"},permiso:{l:"Permiso/Licencia",ic:"📋",c:"#F5A623"},vacaciones:{l:"Vacaciones",ic:"✈️",c:"#4EE0B6"},incapacidad:{l:"Incapacidad",ic:"🏥",c:"#E74C6F"},otro:{l:"Otra Solicitud",ic:"📝",c:"#9E9ED3"}};
const RQS={pendiente:{l:"Pendiente",c:"#F5A623"},aprobada:{l:"Aprobada",c:"#4EE0B6"},rechazada:{l:"Rechazada",c:"#E74C6F"}};

// ====== STATE ======
const TV=4;
const DT=[
  {id:"E1",name:"Angy Paola Córdoba Galeano",tipo:"TC"},
  {id:"E2",name:"Cristian David Orozco Garcia",tipo:"TC"},
  {id:"E3",name:"Dahiana Garcia Atehortua",tipo:"TC"},
  {id:"E4",name:"Yurladis Arboleda Arboleda",tipo:"TC"},
  {id:"E5",name:"Medio Tiempo (Por definir)",tipo:"MT"},
];
let sv=null;try{sv=parseInt(localStorage.getItem('hd-tv'))}catch(e){}
let st=null;try{st=JSON.parse(localStorage.getItem('hd-tm'))}catch(e){}
let team=(sv===TV&&st&&st.length>0)?st:DT;
localStorage.setItem('hd-tv',TV);localStorage.setItem('hd-tm',JSON.stringify(team));
let reqs=JSON.parse(localStorage.getItem('hd-rq'))||[];
let wOff=0,admin=false,curView='cal';
let mf={type:'cambio',empId:'',date:'',details:'',swap:''};

function svTm(){localStorage.setItem('hd-tm',JSON.stringify(team));localStorage.setItem('hd-tv',TV)}
function svRq(){localStorage.setItem('hd-rq',JSON.stringify(reqs))}
function nt(m,t='ok'){const e=document.getElementById('ntEl');e.textContent=m;e.style.background=t==='err'?'#E74C6F':'#28289D';e.className='ntf';setTimeout(()=>e.className='ntf hid',3000)}
function ini(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
function mon(d){const r=new Date(d);const dy=r.getDay();r.setDate(r.getDate()-dy+(dy===0?-6:1));r.setHours(0,0,0,0);return r}
function fD(d){return `${d.getDate()} ${MO[d.getMonth()]} ${d.getFullYear()}`}
function ds(d){return d.toISOString().split('T')[0]}
function gWD(){const m=mon(new Date());m.setDate(m.getDate()+wOff*7);return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return d})}
function isMT(i){return team[i]&&team[i].tipo==='MT'}
function jMax(){return gWD()[0]>=JC?42:44}
function maxT(i){return isMT(i)?3:5} // MT: 3 turnos(24h), TC: 5 turnos(40h)

// ====== ROTACIÓN DINÁMICA ======
function genPat(n,wi){
  const p=[];for(let e=0;e<n;e++)p.push(Array(7).fill('D'));
  for(let d=0;d<7;d++){
    const asg=[];
    for(const tn of['N','T','M']){ // N primero (más restrictivo)
      let be=-1,bs=-999;
      for(let a=0;a<n;a++){
        const e=(a+wi*7+d*3+['N','T','M'].indexOf(tn)*2)%n;
        if(asg.includes(e))continue;
        if(d>0){const pv=p[e][d-1];if(!(VN[pv]||[]).includes(tn))continue}
        const wk=p[e].slice(0,d).filter(s=>s!=='D').length;
        if(wk>=maxT(e))continue;
        let sc=200-wk*35;
        const nc=p[e].slice(0,d).filter(s=>s==='N').length;
        if(tn==='N'&&nc>=2)sc-=90;
        sc-=p[e].slice(0,d).filter(s=>s===tn).length*12;
        if(isMT(e))sc-=15;
        if(tn==='N')sc+=((wi+e)%n)*4;
        if(sc>bs){bs=sc;be=e}
      }
      if(be>=0){p[be][d]=tn;asg.push(be)}
    }
  }
  // Garantizar mín 1 descanso
  for(let e=0;e<n;e++)if(!p[e].includes('D'))for(let d=6;d>=0;d--)if(p[e][d]==='M'){p[e][d]='D';break}
  // Validar cobertura
  for(let d=0;d<7;d++)for(const tn of['M','T','N']){
    if(p.some(r=>r[d]===tn))continue;
    for(let e=0;e<n;e++){
      if(p[e][d]!=='D')continue;
      if(p[e].filter(s=>s!=='D').length>=maxT(e))continue;
      if(d>0&&!(VN[p[e][d-1]]||[]).includes(tn))continue;
      if(tn==='N'&&d<6&&p[e][d+1]!=='D')continue;
      p[e][d]=tn;break;
    }
  }
  return p;
}

// ====== EFFECTIVE SHIFT ======
function eff(ei,di){
  const dt=gWD(),d=dt[di],s=ds(d);
  if(d<CD)return'SC';
  if(ei>=team.length)return'D';
  const eid=team[ei]?.id;
  // Check overrides (custom > special > default rotation)
  const ovr=getOverride(s,eid);
  if(ovr)return ovr.code;
  const df=dt[0].getTime()-CW.getTime(),wi=Math.floor(df/(7*864e5));
  const pat=genPat(team.length,wi);
  let b=pat[ei]?pat[ei][di]:'D';
  // Antes del 12 mayo: sin noche
  if(d<new Date(2026,4,12)&&b==='N')b='M';
  // Cambios aprobados
  const sw=reqs.find(r=>r.type==='cambio'&&r.status==='aprobada'&&r.date===s&&(r.empId===eid||r.swap===eid));
  if(sw){const oi=team.findIndex(t=>t.id===(sw.empId===eid?sw.swap:sw.empId));if(oi>=0){const op=genPat(team.length,wi);return op[oi]?op[oi][di]:'D'}}
  if(reqs.find(r=>['permiso','vacaciones','incapacidad'].includes(r.type)&&r.status==='aprobada'&&r.date===s&&r.empId===eid))return'D';
  return b;
}
// Get effective hours for a cell (considers overrides)
function effHrs(ei,di){
  const dt=gWD(),d=dt[di],s=ds(d);
  const eid=team[ei]?.id;
  const ovr=getOverride(s,eid);
  if(ovr)return ovr.h||0;
  const code=eff(ei,di);
  return SH[code]?.h||0;
}
// Get display info for a cell
function effDisplay(ei,di){
  const dt=gWD(),d=dt[di],s=ds(d);
  const eid=team[ei]?.id;
  const ovr=getOverride(s,eid);
  const code=eff(ei,di);
  const base=SH[code]||SH.D;
  if(ovr){
    return {ic:ovr.code==='D'?'🏖':ovr.code==='C'?'📚':'⚙️',l:ovr.note||base.l,t:ovr.t||base.t,h:ovr.h,bg:ovr.code==='D'?SH.D.bg:ovr.code==='C'?SH.C.bg:SH.X.bg,tc:base.tc!=='#fff'?base.tc:'#28289D'};
  }
  return {ic:base.ic,l:base.l,t:base.t,h:base.h,bg:base.bg,tc:base.tc};
}
function wHrs(ei){let h=0;for(let d=0;d<7;d++)h+=effHrs(ei,d);return Math.round(h*100)/100}

// ====== NAV ======
function sw(v,btn){curView=v;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('a'));if(btn)btn.classList.add('a');['cal','sol','eq','leg'].forEach(id=>document.getElementById('v-'+id).classList.toggle('hid',id!==v));R()}
function togAdmin(){admin=!admin;const b=document.getElementById('aBtn');b.textContent=admin?'🔓 Admin':'👤 Vista';b.className='abtn'+(admin?' on':'');R()}
function oMdl(){document.getElementById('ovl').classList.remove('hid')}
function cMdl(){document.getElementById('ovl').classList.add('hid')}

// ====== RENDER CALENDAR ======
function rCal(){
  const dt=gWD(),td=new Date();
  const df=dt[0].getTime()-CW.getTime(),wi=Math.floor(df/(7*864e5)),sem=Math.max(wi+1,1);
  const jm=jMax();
  let h=`<div class="cd wnav"><button onclick="wOff--;R()">◀</button><div style="text-align:center">
    <div style="font-size:13px;font-weight:600">Semana ${sem} · ${team.length} empleados</div>
    <div style="font-size:10px;color:var(--mut)">${fD(dt[0])} — ${fD(dt[6])}</div>
    <div style="font-size:8px;color:var(--mut);margin-top:2px">Meta: ${jm}h/sem (TC) · 22h/sem (MT) · Inicio: 7 May 2026</div>
  </div><button onclick="wOff++;R()">▶</button></div>`;
  if(wOff!==0)h+=`<div style="text-align:center;margin-bottom:8px"><button onclick="wOff=0;R()" style="background:var(--navy);color:#fff;border:none;border-radius:7px;padding:4px 14px;font-size:10px;font-weight:500">↩ Semana actual</button></div>`;
  // Legend
  h+=`<div class="leg">`;

      </select>
      
      <label>Horas netas (calculadas automáticamente)</label>
      <input type="number" id="seHrs" value="${curHrs||8}" step="0.5" min="0" max="12" readonly style="background:var(--bg);font-weight:700;color:var(--navy)">
      
      <label>Nota / Descripción</label>
      <input type="text" id="seNote" value="${curNote}" placeholder="Ej: Jornada adaptación">
    </div>

    <label style="margin-top:12px">Aplicar a</label>
    <select id="seScope">
      <option value="emp">Solo ${empName.split(' ')[0]}</option>
      <option value="all">Todos los empleados (${dateStr})</option>
    </select>

    <div style="display:flex;gap:6px;margin-top:16px">
      <button class="bp" style="flex:2;margin:0" onclick="saveShiftEdit('${empId}','${dateStr}')">💾 Guardar</button>
      ${existing?`<button onclick="delShiftEdit('${empId}','${dateStr}')" style="flex:1;padding:12px;background:var(--danger);color:#fff;border:none;border-radius:12px;font-size:12px;font-weight:600">🗑 Quitar</button>`:''}
    </div>`;
  
  document.getElementById('mdlC').innerHTML=h;
  oMdl();
  updShiftForm();
}

function updShiftForm(){
  const code=document.getElementById('seCode').value;
  const cf=document.getElementById('customFields');
  if(code==='D'){cf.style.display='none';return}
  cf.style.display='block';
  // Auto-fill times for standard shifts
  const seS=document.getElementById('seStart'),seE=document.getElementById('seEnd');
  if(code==='M'){seS.value='06:00';seE.value='14:00'}
  else if(code==='T'){seS.value='14:00';seE.value='22:00'}
  else if(code==='N'){seS.value='22:00';seE.value='06:00'}
  else if(code==='C'){seS.value='07:30';seE.value='16:30'}
  calcShiftHrs();
}

function calcShiftHrs(){
  const s=document.getElementById('seStart')?.value,e=document.getElementById('seEnd')?.value;
  const alm=parseInt(document.getElementById('seAlm')?.value)||0;
  if(!s||!e)return;
  let sh=parseInt(s.split(':')[0]),sm=parseInt(s.split(':')[1]);
  let eh=parseInt(e.split(':')[0]),em=parseInt(e.split(':')[1]);
  let mins=(eh*60+em)-(sh*60+sm);
  if(mins<0)mins+=24*60; // cruce de medianoche
  mins-=alm;
  const hrs=Math.round(mins/60*100)/100;
  const el=document.getElementById('seHrs');
  if(el)el.value=hrs>0?hrs:0;
}
// Attach listeners after modal renders
document.addEventListener('change',function(e){
  if(['seStart','seEnd','seAlm'].includes(e.target?.id))calcShiftHrs();
});

function saveShiftEdit(empId,dateStr){
  const code=document.getElementById('seCode').value;
  const scope=document.getElementById('seScope').value;
  
  if(code==='D'){
    const data={code:'D',t:'—',h:0,note:'Descanso asignado'};
    if(scope==='all'){setOverride(dateStr,null,data);team.forEach(t=>setOverride(dateStr,t.id,null))}
    else setOverride(dateStr,empId,data);
  } else {
    const st=document.getElementById('seStart').value;
    const en=document.getElementById('seEnd').value;
    const hrs=parseFloat(document.getElementById('seHrs').value)||0;
    const note=document.getElementById('seNote').value.trim();
    const alm=parseInt(document.getElementById('seAlm').value)||0;
    const data={code,t:`${st}–${en}`,h:hrs,note:note||SH[code]?.l||'Personalizado',almuerzo:alm};
    if(scope==='all'){setOverride(dateStr,null,data);team.forEach(t=>setOverride(dateStr,t.id,null))}
    else setOverride(dateStr,empId,data);
  }
  cMdl();nt('Horario guardado');R();
}

function delShiftEdit(empId,dateStr){
  setOverride(dateStr,empId,null);
  setOverride(dateStr,null,null); // also remove global if exists
  cMdl();nt('Override eliminado — vuelve a rotación automática');R();
}

// ====== EXPORTAR A EXCEL ======
function exportExcel(){
  const dt=gWD();
  const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DIASF=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  
  // Generar datos de todo el mes visible
  // Primero exportar la semana actual, luego ofrecer mes completo
  let csv='\uFEFF'; // BOM para que Excel lea tildes
  
  // Título
  csv+=`holadr - Cuadro de Turnos 24/7\n`;
  csv+=`Semana: ${fD(dt[0])} al ${fD(dt[6])}\n`;
  csv+=`Generado: ${new Date().toLocaleString('es-CO')}\n`;
  csv+=`Jornada meta: ${jMax()}h/sem (TC) · 22h/sem (MT)\n\n`;
  
  // Encabezados
  csv+=`Empleado,Tipo`;
  dt.forEach((d,i)=>{
    csv+=`,${DY[i]} ${d.getDate()}/${d.getMonth()+1}`;
  });
  csv+=`,Total Sem,Proy. Mes\n`;
  
  // Datos por empleado
  team.forEach((emp,ei)=>{
    const mt=isMT(ei);
    // Fila de turno
    csv+=`"${emp.name}",${mt?'MT':'TC'}`;
    dt.forEach((d,di)=>{
      const ed=effDisplay(ei,di);
      csv+=`,"${ed.l} ${ed.t}"`;
    });
    const hrs=wHrs(ei);
    csv+=`,${hrs}h,~${Math.round(hrs*4.33)}h\n`;
    
    // Fila de horas
    csv+=`"",Horas`;
    dt.forEach((d,di)=>{
      const h=effHrs(ei,di);
      csv+=`,${h>0?h+'h':'—'}`;
    });
    csv+=`,${wHrs(ei)}h,\n`;
  });
  
  // Resumen
  csv+=`\nRESUMEN\n`;
  csv+=`Total horas equipo/semana,${Math.round(team.reduce((a,_,i)=>a+wHrs(i),0)*10)/10}h\n`;
  csv+=`Empleados TC,${team.filter((_,i)=>!isMT(i)).length}\n`;
  csv+=`Empleados MT,${team.filter((_,i)=>isMT(i)).length}\n`;
  
  // Cobertura
  csv+=`\nCOBERTURA DIARIA\n`;
  csv+=`,`;
  dt.forEach((d,i)=>csv+=`${DY[i]} ${d.getDate()},`);
  csv+=`\n`;
  ['M','T','N'].forEach(tn=>{
    const info=SH[tn];
    csv+=`${info.l} (${info.t})`;
    dt.forEach((d,di)=>{
      const quien=team.filter((_,ei)=>eff(ei,di)===tn).map(e=>e.name.split(' ')[0]);
      csv+=`,${quien.length>0?quien.join(' / '):'⚠️ SIN COBERTURA'}`;
    });
    csv+=`\n`;
  });
  
  // Notas especiales del período
  csv+=`\nFECHAS ESPECIALES\n`;
  dt.forEach(d=>{
    const s=ds(d);
    const ovr=SP_DEFAULT[s]||customOvr[s];
    if(ovr)csv+=`${s},${ovr.note||ovr.code},${ovr.t},${ovr.h}h\n`;
  });
  
  csv+=`\nNORMATIVA: Art. 161 CST + Ley 2101/2021. N→Descanso obligatorio. T→M prohibido.\n`;
  
  // Descargar
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`Turnos_holadr_Sem${fD(dt[0]).replace(/ /g,'_')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  nt('Excel exportado ✅');
}

// Exportar mes completo
function exportMes(){
  const dt=gWD();
  const mesActual=dt[0].getMonth();
  const anio=dt[0].getFullYear();
  const primerDia=new Date(anio,mesActual,1);
  const ultimoDia=new Date(anio,mesActual+1,0);
  const MES_N=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  
  let csv='\uFEFF';
  csv+=`holadr - Turnos del Mes: ${MES_N[mesActual]} ${anio}\n`;
  csv+=`Generado: ${new Date().toLocaleString('es-CO')}\n\n`;
  
  // Encabezados: todos los días del mes
  const diasMes=[];
  for(let d=new Date(primerDia);d<=ultimoDia;d.setDate(d.getDate()+1)){
    diasMes.push(new Date(d));
  }
  
  csv+=`Empleado,Tipo`;
  diasMes.forEach(d=>{
    const dn=['D','L','M','X','J','V','S'][d.getDay()];
    csv+=`,${dn}${d.getDate()}`;
  });
  csv+=`,Total Mes\n`;
  
  // Para calcular cada día, necesito simular la semana correspondiente
  team.forEach((emp,ei)=>{
    const mt=isMT(ei);
    csv+=`"${emp.name}",${mt?'MT':'TC'}`;
    let totalMes=0;
    diasMes.forEach(d=>{
      // Calcular semana de este día
      const savedOff=wOff;
      const todayMon=mon(new Date());
      const dayMon=mon(d);
      wOff=Math.round((dayMon.getTime()-todayMon.getTime())/(7*864e5));
      const wdt=gWD();
      const di=wdt.findIndex(wd=>wd.toDateString()===d.toDateString());
      let h=0,label='—';
      if(di>=0){
        const ed=effDisplay(ei,di);
        h=effHrs(ei,di);
        label=h>0?`${h}h`:'D';
      }
      totalMes+=h;
      csv+=`,${label}`;
      wOff=savedOff;
    });
    csv+=`,${Math.round(totalMes*10)/10}h\n`;
  });
  
  // Descargar
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`Turnos_holadr_${MES_N[mesActual]}_${anio}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  nt('Mes exportado ✅');
}
